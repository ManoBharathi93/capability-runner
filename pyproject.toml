[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[project]
name = "capability-runner"
version = "0.1.0"
description = "Discover reusable UI capabilities and replay them without model decisions."
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "flask>=3.1.3",
    "httpx>=0.28.1",
    "playwright>=1.62.0",
    "pydantic>=2,<3",
]

[project.scripts]
capability-runner = "demo_app.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1,<2",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/capability_runner", "demo_app"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = '-ra --strict-markers -m "not live"'
testpaths = ["tests"]
markers = [
    "live: explicitly selected tests that call configured external services",
]

[tool.ruff]
extend-exclude = [".venv*"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
